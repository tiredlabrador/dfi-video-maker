<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Dig — DFI Video Maker</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/dig.css">
</head>
<body class="dig">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path fill="currentColor" d="M6 4h4v16H6zM14 4h4v16h-4z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-grip" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></g></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 18V5l11-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM20 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M3 6.5A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5zM3 16l5-5 4 4 3-3 6 6"/></symbol>
</svg>

<header class="topbar">
  <div class="brand"><span class="mark">DFI</span> Video Maker</div>
  <nav class="appswitch" aria-label="Video type">
    <a href="/" aria-current="page">The Dig</a>
    <a href="/static/divein.html">Dive In</a>
  </nav>
  <div class="spacer"></div>
  <div class="status" id="health" aria-live="polite">Connecting…</div>
  <div class="actions">
    <button type="button" class="btn btn--ghost" id="preview-all" title="Small, quick versions of every track">Preview all</button>
    <button type="button" class="btn" id="render-all">Render all</button>
  </div>
</header>

<div class="dig-layout">
  <main class="tracks-pane" aria-label="Tracks">
    <div class="tracks-head">
      <h2 id="tracks-count">Tracks</h2>
      <button type="button" class="btn btn--small btn--ghost" id="add-tracks"><svg><use href="#i-plus"/></svg> Add tracks</button>
      <div class="spacer"></div>
      <span class="small muted" id="tracks-hint">Drag to reorder: the numbers are the posting order.</span>
      <a class="btn btn--small" id="zip-download" hidden download>Download all</a>
    </div>
    <input type="file" id="tracks-input" accept="audio/*,.mp3,.wav,.flac,.m4a,.aiff" multiple hidden>
    <input type="file" id="art-input" accept="image/*" hidden>

    <ol class="track-list" id="track-list"></ol>

    <button type="button" class="tracks-empty" id="tracks-empty">
      <svg><use href="#i-music"/></svg>
      <strong>Drop tracks here</strong>
      <span class="muted">or click to choose. One track or a whole batch.</span>
    </button>

    <div class="batch-progress" id="batch-progress" hidden>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <p class="small muted" id="progress-text"></p>
    </div>
  </main>

  <aside class="viewer-pane" aria-label="Preview">
    <div class="dig-stage" id="stage">
      <div class="dig-empty" id="stage-empty">
        <div class="record" aria-hidden="true"><span></span></div>
        <p class="muted">The selected track’s artwork and video show here.</p>
      </div>
      <div class="dig-art" id="stage-art" hidden>
        <div class="record record--art" aria-hidden="true"><img id="art-preview" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="><span></span></div>
      </div>
      <video id="player" controls playsinline hidden></video>
    </div>
    <div class="dig-info" id="info" hidden>
      <p class="info-title" id="info-title"></p>
      <p class="small muted" id="info-art"></p>
      <dl class="facts" id="facts"></dl>
      <a class="btn btn--small" id="download" download hidden>Download</a>
    </div>
  </aside>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
